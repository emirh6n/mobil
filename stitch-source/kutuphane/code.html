<!DOCTYPE html><html lang="tr" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>TRKN - Kütüphane</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols Icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            app: {
              bg: '#111315',
              card: '#181b1e',
              border: '#26292e',
              input: '#121417',
              lime: '#8be822',
              'lime-hover': '#7cd41c',
              textPrimary: '#f1f3f5',
              textSecondary: '#8a919e',
              textMuted: '#585e6b',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- Custom Stylesheet -->
<style data-purpose="app-custom-layout">
    /* iOS Safe Area handling */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 12px);
    }
    /* Hide native scrollbars */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1;
    }
  </style>
</head>
<body class="bg-app-bg text-app-textPrimary min-h-screen flex flex-col font-sans select-none antialiased" style="background-color: rgb(18, 19, 22);">
<!-- BEGIN: TopHeader -->
<header class="sticky top-0 z-30 bg-app-bg/95 backdrop-blur-md px-4 pt-safe pb-3 border-b border-app-border/40" style="background-color: rgb(18, 19, 22); border-bottom: 1px solid rgba(38, 40, 46, 0.6);">
<div class="flex items-center justify-between h-12">
<!-- Back button & Title -->
<div class="flex items-center space-x-3">
<button aria-label="Geri" class="text-app-textPrimary hover:text-white transition-colors p-1 -ml-1" type="button">
<span class="material-symbols-outlined text-2xl leading-none">arrow_back</span>
</button>
<h1 class="text-xl font-bold tracking-tight text-white">Kütüphane</h1>
</div>
<!-- Right Action Controls (Date Badge & Menu) -->
<div class="flex items-center space-x-2">
<!-- Date pill -->
<button class="flex items-center space-x-1.5 bg-app-card border border-app-border px-3 py-1.5 rounded-xl text-xs font-semibold text-app-textPrimary tracking-wide" type="button" style="background-color: rgb(27, 27, 31); border-color: rgb(38, 40, 46);">
<span class="material-symbols-outlined text-app-lime text-base leading-none">calendar_today</span>
<span class="">01 EKİ</span>
</button>
<!-- Menu button -->
<button aria-label="Ayarlar" class="w-10 h-10 flex items-center justify-center rounded-xl text-app-textPrimary hover:text-white transition-colors" style="background-color: rgb(27, 27, 31); border: 1px solid rgb(38, 40, 46);" type="button"><span class="material-symbols-outlined text-xl">settings</span></button>
</div>
</div>
</header>
<!-- END: TopHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 px-4 py-4 space-y-5 pb-28 max-w-md mx-auto w-full">
<!-- Selected Date Banner Info -->
<div class="flex items-center justify-between text-xs px-1 font-medium tracking-wide">


</div>
<!-- BEGIN: LibraryManagementCard -->
<section class="bg-app-card border border-app-border rounded-2xl p-4 shadow-sm space-y-4" data-purpose="new-entry-form" style="background-color: rgb(27, 27, 31); border: 1px solid rgb(38, 40, 46);">
<!-- Section Header -->
<div class="flex items-center justify-between">
<h2 class="text-base font-bold text-app-lime">Kütüphane Yönetimi</h2>
<span class="text-xs text-app-textSecondary font-medium">2 kaynak</span>
</div>
<form class="space-y-3.5" onsubmit="event.preventDefault();"><div class="space-y-1.5">
<label class="text-xs font-medium text-app-textSecondary block" for="resource-title">Kaynak adı</label>
<input class="w-full bg-[#1b1b1f] border border-app-border text-white text-sm rounded-xl px-3.5 py-2.5 placeholder-app-textMuted focus:outline-none focus:border-app-lime focus:ring-1 focus:ring-app-lime transition-all" id="resource-title" name="resource-title" placeholder="Kaynak adı" type="text">
</div>
<div class="space-y-1.5">
<label class="text-xs font-medium text-app-textSecondary block" for="resource-category">Kategori</label>
<input class="w-full bg-[#1b1b1f] border border-app-border text-white text-sm rounded-xl px-3.5 py-2.5 placeholder-app-textMuted focus:outline-none focus:border-app-lime focus:ring-1 focus:ring-app-lime transition-all" id="resource-category" name="resource-category" placeholder="Örn. Antrenman, Beslenme" type="text">
</div>
<div class="space-y-1.5">
<label class="text-xs font-medium text-app-textSecondary block" for="resource-url">Bağlantı (isteğe bağlı)</label>
<input class="w-full bg-[#1b1b1f] border border-app-border text-white text-sm rounded-xl px-3.5 py-2.5 placeholder-app-textMuted focus:outline-none focus:border-app-lime focus:ring-1 focus:ring-app-lime transition-all" id="resource-url" name="resource-url" placeholder="https://..." type="url">
</div>
<div class="space-y-1.5">
<label class="text-xs font-medium text-app-textSecondary block" for="resource-notes">Ana fikir / çıkarım</label>
<textarea class="w-full bg-[#1b1b1f] border border-app-border text-white text-sm rounded-xl p-3.5 placeholder-app-textMuted resize-none focus:outline-none focus:border-app-lime focus:ring-1 focus:ring-app-lime transition-all" id="resource-notes" name="resource-notes" placeholder="Kısa bir not ekle..." rows="3"></textarea>
</div>
<button class="w-full bg-app-lime hover:bg-app-lime-hover active:scale-[0.99] text-black font-semibold text-sm py-3 rounded-xl flex items-center justify-center space-x-1.5 transition-all shadow-md mt-2" type="button">
<span class="material-symbols-outlined text-lg leading-none font-bold">add</span>
<span class="">Kütüphaneye ekle</span>
</button></form>
</section>
<!-- END: LibraryManagementCard -->
<!-- BEGIN: SearchAndFilterCard -->
<section class="bg-app-card border border-app-border rounded-2xl p-4 shadow-sm space-y-4" data-purpose="search-and-list" style="background-color: rgb(27, 27, 31); border: 1px solid rgb(38, 40, 46);">
<!-- Section Title -->
<h2 class="text-base font-bold text-app-lime">Kaynaklarını bul</h2>
<!-- Search Input -->
<div class="relative"><input class="w-full bg-[#1b1b1f] border border-app-border text-white text-sm rounded-xl pl-3.5 pr-10 py-2.5 placeholder-app-textMuted focus:outline-none focus:border-app-lime focus:ring-1 focus:ring-app-lime transition-all" placeholder="Kaynak ara" type="text">
<span class="material-symbols-outlined absolute right-3 top-2.5 text-app-textMuted pointer-events-none text-xl">search</span></div>
<!-- Filter Selection Input -->
<div><input class="w-full bg-[#1b1b1f] border border-app-border text-white text-sm rounded-xl px-3.5 py-2.5 placeholder-app-textMuted focus:outline-none focus:border-app-lime focus:ring-1 focus:ring-app-lime transition-all" placeholder="Kategoriye göre filtrele" type="text"></div>
<!-- Category Filter Chips -->
<div class="flex items-center space-x-2 pt-1 overflow-x-auto no-scrollbar">
<button class="bg-app-input border border-app-lime text-app-lime px-4 py-1.5 rounded-lg text-xs font-medium shrink-0" type="button">
          Tümü
        </button>


</div>
<!-- Existing Library Items List -->
<div class="space-y-3 pt-2">
<!-- Item 1: Hipertrofi Frekansı -->

<!-- Item 2: Protein Sentezi -->

</div>
<!-- Pagination Navigation -->
<nav aria-label="Sayfalama" class="flex items-center justify-between pt-2">
<button class="bg-app-input border border-app-border text-app-textSecondary text-xs font-medium px-4 py-2 rounded-xl hover:text-white transition-colors" type="button">
          Önceki
        </button>
<span class="text-xs text-app-textSecondary font-semibold">1 / 1</span>
<button class="bg-app-input border border-app-border text-app-textSecondary text-xs font-medium px-4 py-2 rounded-xl hover:text-white transition-colors" type="button">
          Sonraki
        </button>
</nav>
</section>
<!-- END: SearchAndFilterCard -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomNavigation -->
<nav class="fixed bottom-0 left-0 right-0 z-40 bg-app-card/95 backdrop-blur-lg border-t border-app-border/60 pb-safe" style="background-color: rgb(18, 19, 22); border-top: 1px solid rgba(38, 40, 46, 0.6);">
<div class="max-w-md mx-auto grid grid-cols-4 h-16 items-center px-2">
<!-- Tab 1: Ana Sayfa -->
<a class="flex flex-col items-center justify-center space-y-1 text-app-textMuted hover:text-white transition-colors" href="#home">
<span class="material-symbols-outlined text-2xl leading-none">home</span>
<span class="text-[10px] font-medium">Ana Sayfa</span>
</a>
<!-- Tab 2: Spor -->
<a class="flex flex-col items-center justify-center space-y-1 text-app-textMuted hover:text-white transition-colors" href="#workout">
<span class="material-symbols-outlined text-2xl leading-none">fitness_center</span>
<span class="text-[10px] font-medium">Spor</span>
</a>
<!-- Tab 3: Besin -->
<a class="flex flex-col items-center justify-center space-y-1 text-app-textMuted hover:text-white transition-colors" href="#nutrition">
<span class="material-symbols-outlined text-2xl leading-none">restaurant</span>
<span class="text-[10px] font-medium">Besin</span>
</a>
<!-- Tab 4: İstatistik -->
<a class="flex flex-col items-center justify-center space-y-1 text-app-lime transition-colors" href="#stats">
<span class="material-symbols-outlined text-2xl leading-none fill">query_stats</span>
<span class="text-[10px] font-semibold">İstatistik</span>
</a>
</div>
</nav>
<!-- END: BottomNavigation -->


</body></html>
